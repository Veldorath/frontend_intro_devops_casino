name: CI/CD casino-frontend -> ECR -> EKS

on:
  push:
    branches: [ deploy ]      # solo la rama deploy dispara el pipeline
  workflow_dispatch:           # permite lanzarlo a mano desde la pestana Actions

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: casino-eks
  ECR_REPOSITORY: casino-frontend
  DEPLOYMENT: casino-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar el codigo
        uses: actions/checkout@v4

      - name: 2. Configurar credenciales AWS (temporales del lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 3. Login en Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 4. Build y push con 3 tags (vX.Y.Z, latest, sha)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:$VERSION" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" \
            -t "$REGISTRY/$ECR_REPOSITORY:$SHA" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$VERSION"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$REGISTRY/$ECR_REPOSITORY:$SHA"

      - name: 5. Instalar kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/kubectl

      - name: 6. Conectar kubectl al cluster
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - name: 7. Desplegar en EKS
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          # Primera vez: crea Deployment y Service sustituyendo los marcadores.
          sed -i "s|<ACCOUNT_ID>|$ACCOUNT_ID|g; s|<REGION>|$AWS_REGION|g" k8s/deployment.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          # Actualiza la imagen al SHA exacto de este commit (trazabilidad).
          kubectl set image deployment/$DEPLOYMENT \
            $DEPLOYMENT="$REGISTRY/$ECR_REPOSITORY:$SHA"
          kubectl rollout status deployment/$DEPLOYMENT --timeout=180s

      - name: 8. Mostrar estado
        run: kubectl get pods -l app=$DEPLOYMENT -o wide
