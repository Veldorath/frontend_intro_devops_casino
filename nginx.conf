# nginx.conf — casino-frontend
# Sirve la SPA Angular en el puerto 8080 (nginx-unprivileged) y enruta /api/*
# a los backends por DNS INTERNO del cluster (ClusterIP por servicio).
#
# IMPORTANTE: el orden de los bloques location importa. Los prefijos mas
# especificos (/api/bonos, /api/apuestas, /api/estadisticas) van ANTES del
# /api/ general, que cae al casino-backend (auth, usuarios, juegos, transacciones).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Microservicios Python (prefijo especifico primero) ---
    location /api/bonos {
        proxy_pass http://bonos-service:8004;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/apuestas {
        proxy_pass http://apuestas-service:8005;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/estadisticas {
        proxy_pass http://estadisticas-service:8006;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- Resto de la API → casino-backend (auth, usuarios, juegos, transacciones) ---
    location /api/ {
        proxy_pass http://casino-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- SPA Angular: cualquier otra ruta devuelve index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
