apiVersion: v1
kind: Service
metadata:
  name: casino-frontend
  labels:
    app: casino-frontend
spec:
  type: LoadBalancer        # AWS crea un ELB publico (URL de Internet)
  selector:
    app: casino-frontend
  ports:
    - name: http
      protocol: TCP
      port: 80              # puerto publico
      targetPort: 8080      # nginx-unprivileged escucha en 8080
